

services:
  ocr:
    build:
      context: ./ocr_service
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Use restart policy to ensure it comes back if it crashes

  backend:
    build:
      context: ./server
    environment:
      - NODE_ENV=production
      - OCR_SERVICE_URL=http://ocr:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - BACKEND_URL=
    depends_on:
      - ocr
    volumes:
      - ./server/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    command: caddy reverse-proxy --from ${DOMAIN:-evde-test.duckdns.org} --to frontend:80

volumes:
  caddy_data:
  caddy_config:
